<script>
(function() {
  const totalPages = 10;
  const pagePrefix = 'page';
  const pageExt    = '.html';
  const path       = location.pathname;
  
  // Determine current page: pageN.html → N, otherwise 1
  let current = 8;
  const m = path.match(/page_(\d+)\.html$/);
  if (m) current = parseInt(m[1], 10);

  const nav = document.getElementById('pagination');

  function makeLink(page, text, cls) {
    const a = document.createElement('a');
    a.href = (page === 1 ? 'index.html' : pagePrefix + '_' + page + pageExt);
    a.textContent = text;
    if (cls) a.classList.add(cls);
    return a;
  }

  function makeEllipsis() {
    const e = document.createElement('a');
    e.textContent = '…';
    e.classList.add('disabled');
    return e;
  }

  // First & Prev
  nav.appendChild(
    current === 1
      ? makeLink(1, '« First', 'disabled')
      : makeLink(1, '« First')
  );
  nav.appendChild(
    current > 1
      ? makeLink(current - 1, '‹ Prev')
      : makeLink(1, '‹ Prev', 'disabled')
  );

  // Compute sliding window
  const windowSize = 2;
  let start = current - windowSize;
  let end   = current + windowSize;
  if (start < 1) start = 1;
  if (end > totalPages) end = totalPages;

  // Leading ellipsis if needed
  if (start > 1) {
    nav.appendChild(makeEllipsis());
  }

  // Page numbers in window
  for (let i = start; i <= end; i++) {
    if (i === current) {
      const a = makeLink(i, i, 'current');
      a.removeAttribute('href');
      nav.appendChild(a);
    } else {
      nav.appendChild(makeLink(i, i));
    }
  }

  // Trailing ellipsis if needed
  if (end < totalPages) {
    nav.appendChild(makeEllipsis());
  }

  // Next & Last
  nav.appendChild(
    current < totalPages
      ? makeLink(current + 1, 'Next ›')
      : makeLink(totalPages, 'Next ›', 'disabled')
  );
  nav.appendChild(
    current === totalPages
      ? makeLink(totalPages, 'Last »', 'disabled')
      : makeLink(totalPages, 'Last »')
  );
})();
</script>
</body>
</html>
